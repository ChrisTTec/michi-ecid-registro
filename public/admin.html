<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Michi ECID Registro</title>
<link rel="icon" href="/icono.ico">
<style>
  :root { --bg:#101014; --card:#1a1a22; --line:#26262e; --ok:#00c828; --warn:#c81e1e; --accent:#3478f6; --txt:#e8e9f0; --dim:#8b8d98; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(1200px 600px at 70% -10%, #1c1c28 0%, var(--bg) 60%); color:var(--txt); font-family:"Segoe UI",system-ui,sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; border-bottom:1px solid var(--line); background:rgba(16,16,20,.85); backdrop-filter:blur(6px); position:sticky; top:0; flex-wrap:wrap; }
  header .left { display:flex; align-items:center; gap:14px; }
  header img { width:38px; height:38px; border-radius:8px; border:1px solid var(--line); }
  header .t { font-size:17px; font-weight:600; letter-spacing:.3px; }
  header .s { font-size:12.5px; color:var(--dim); }
  header .user-info { display:flex; align-items:center; gap:16px; font-size:13.5px; color:var(--txt); }
  header .badge-admin { background:var(--warn); color:#fff; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700; }
  header .btn-logout { background:var(--card); border:1px solid var(--line); color:var(--txt); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; transition:.15s; }
  header .btn-logout:hover { border-color:var(--warn); color:var(--warn); }
  main { max-width:1100px; margin:0 auto; padding:28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:24px; }
  .tarjeta { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  .tarjeta .label { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  .tarjeta .valor { font-size:28px; font-weight:700; margin-top:6px; color:var(--accent); }
  .tarjeta .valor small { font-size:14px; color:var(--dim); font-weight:500; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  .panel .head { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  .panel .head .btn { background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:12px 20px; font-size:13.5px; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--line); }
  td { border-top:1px solid var(--line); }
  td code { background:#0d0f14; border:1px solid var(--line); padding:3px 8px; border-radius:6px; font-size:13px; color:var(--accent); }
  .badge { padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; }
  .b-ok { background:rgba(0,200,40,.12); color:var(--ok); border:1px solid rgba(0,200,40,.3); }
  .b-warn { background:rgba(200,30,30,.12); color:var(--warn); border:1px solid rgba(200,30,30,.3); }
  .hora { color:var(--dim); font-size:12.5px; }
  .vacio { padding:60px 20px; text-align:center; color:var(--dim); }
  .vacio .g { font-size:36px; margin-bottom:8px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal.show { display:flex; }
  .modal-box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; width:100%; max-width:420px; }
  .modal-box h3 { margin-bottom:16px; }
  .modal-box .form-group { margin-bottom:16px; }
  .modal-box label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
  .modal-box input, .modal-box select { width:100%; background:#0d0f14; border:1px solid var(--line); border-radius:8px; padding:12px 14px; color:var(--txt); font-size:14px; }
  .modal-box .btns { display:flex; gap:12px; margin-top:20px; }
  .modal-box .btn { flex:1; padding:12px; border-radius:8px; font-weight:600; border:none; cursor:pointer; }
  .modal-box .btn-cancel { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .modal-box .btn-primary { background:var(--accent); color:#fff; }
  .creditos-input { width:100px; }
  @media (max-width:640px) { header { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<header>
  <div class="left">
    <img src="/icono.ico" alt="Michi Ramdisk">
    <div>
      <div class="t">Michi ECID Registro</div>
      <div class="s"><span class="badge-admin">ADMIN</span> Panel de administración</div>
    </div>
  </div>
  <div class="user-info">
    <span id="adminEmail">cargando…</span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
</header>
<main>
  <section class="grid">
    <div class="tarjeta"><div class="label">Total usuarios</div><div class="valor" id="totalUsuarios">–</div></div>
    <div class="tarjeta"><div class="label">Total créditos</div><div class="valor" id="totalCreditos">–</div></div>
    <div class="tarjeta"><div class="label">ECIDs totales</div><div class="valor" id="totalEcids">–</div></div>
  </section>

  <section class="panel">
    <div class="head"><span>Usuarios</span><button class="btn" onclick="abrirModalCrear()">+ Nuevo usuario</button></div>
    <table>
      <thead><tr><th>Email</th><th>Créditos</th><th>Registrado</th><th>Acciones</th></tr></thead>
      <tbody id="tbodyUsuarios"></tbody>
    </table>
  </section>

  <section class="panel">
    <div class="head"><span>ECIDs globales</span></div>
    <table>
      <thead><tr><th>ECID</th><th>Usuario</th><th>Primera vez</th><th>Última vez</th><th>Veces</th></tr></thead>
      <tbody id="tbodyEcids"></tbody>
    </table>
  </section>
</main>

<!-- Modal crear/editar usuario -->
<div class="modal" id="modalUsuario">
  <div class="modal-box">
    <h3 id="modalTitulo">Nuevo usuario</h3>
    <form id="formUsuario">
      <input type="hidden" id="editUserId">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="inputEmail" required>
      </div>
      <div class="form-group">
        <label>Contraseña <span id="passHint">(mín. 8 chars, deja vacío para no cambiar)</span></label>
        <input type="password" id="inputPass" minlength="8">
      </div>
      <div class="form-group">
        <label>Créditos</label>
        <input type="number" id="inputCreditos" class="creditos-input" min="0" value="0">
      </div>
      <div class="btns">
        <button type="button" class="btn btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal sumar créditos -->
<div class="modal" id="modalCreditos">
  <div class="modal-box">
    <h3>Sumar créditos a <span id="credUserEmail"></span></h3>
    <form id="formCreditos">
      <input type="hidden" id="credUserId">
      <div class="form-group">
        <label>Cantidad a sumar</label>
        <input type="number" id="inputSumar" class="creditos-input" min="1" value="10" required>
      </div>
      <div class="btns">
        <button type="button" class="btn btn-cancel" onclick="cerrarModalCreditos()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Sumar</button>
      </div>
    </form>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = iso => iso ? new Date(iso).toLocaleString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

async function api(path, opts={}) {
  const res = await fetch(path, { ...opts, credentials: 'include', headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) }});
  if (res.status === 401 || res.status === 403) { window.location.href = '/login.html'; throw new Error('No autorizado'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error');
  return data;
}

async function cargarAdmin() {
  try {
    const [ses, stats, usuarios, ecids] = await Promise.all([
      api('/api/sesion'),
      api('/api/admin/stats'),
      api('/api/admin/usuarios'),
      api('/api/admin/ecids')
    ]);
    if (!ses.ok || !ses.creditos) { window.location.href = '/login.html'; return; }
    // Verificar admin (podrías usar un claim o email fijo)
    // Por ahora asumimos que si llega aquí es admin
    $('adminEmail').textContent = ses.email + ' ';

    $('totalUsuarios').textContent = stats.totalUsuarios;
    $('totalCreditos').textContent = stats.totalCreditos;
    $('totalEcids').textContent = stats.totalEcids;

    renderUsuarios(usuarios);
    renderEcids(ecids);
  } catch (e) {
    if (e.message.includes('401') || e.message.includes('403')) window.location.href = '/login.html';
  }
}

function renderUsuarios(list) {
  const tbody = $('tbodyUsuarios');
  tbody.innerHTML = '';
  list.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.email}</td>
      <td><span class="badge ${u.creditos > 0 ? 'b-ok' : 'b-warn'}">${u.creditos} créditos</span></td>
      <td class="hora">${new Date(u.creado).toLocaleString('es-ES')}</td>
      <td>
        <button class="btn" style="padding:4px 10px;font-size:12px;" onclick="abrirModalCreditos('${u.id}', '${u.email}')">+ Créditos</button>
        <button class="btn" style="padding:4px 10px;font-size:12px;margin-left:4px;background:var(--card);border:1px solid var(--line);" onclick="editarUsuario('${u.id}', '${u.email}', ${u.creditos})">Editar</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function renderEcids(list) {
  const tbody = $('tbodyEcids');
  tbody.innerHTML = '';
  list.slice(0, 200).forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><code>${e.ecid}</code></td>
      <td>${e.usuario_email || '—'}</td>
      <td class="hora">${new Date(e.creado).toLocaleString('es-ES')}</td>
      <td class="hora">${new Date(e.ultima_vez).toLocaleString('es-ES')}</td>
      <td>${e.veces}</td>`;
    tbody.appendChild(tr);
  });
}

// --- Modales ---
let editMode = false;
function abrirModalCrear() {
  editMode = false;
  $('modalTitulo').textContent = 'Nuevo usuario';
  $('formUsuario').reset();
  $('editUserId').value = '';
  $('inputPass').required = true;
  $('passHint').textContent = '(mín. 8 chars)';
  $('modalUsuario').classList.add('show');
}
function editarUsuario(id, email, creditos) {
  editMode = true;
  $('modalTitulo').textContent = 'Editar usuario';
  $('editUserId').value = id;
  $('inputEmail').value = email;
  $('inputCreditos').value = creditos;
  $('inputPass').required = false;
  $('passHint').textContent = '(deja vacío para no cambiar)';
  $('modalUsuario').classList.add('show');
}
function cerrarModal() { $('modalUsuario').classList.remove('show'); }

function abrirModalCreditos(id, email) {
  $('credUserId').value = id;
  $('credUserEmail').textContent = email;
  $('formCreditos').reset();
  $('modalCreditos').classList.add('show');
}
function cerrarModalCreditos() { $('modalCreditos').classList.remove('show'); }

$('formUsuario').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('editUserId').value;
  const email = $('inputEmail').value.trim();
  const pass = $('inputPass').value;
  const creditos = parseInt($('inputCreditos').value) || 0;
  try {
    if (editMode) {
      const body = { email, creditos };
      if (pass) body.pass = pass;
      await api('/api/admin/usuario/' + id, { method: 'PUT', body: JSON.stringify(body) });
    } else {
      await api('/api/admin/usuario', { method: 'POST', body: JSON.stringify({ email: $('inputEmail').value, pass: $('inputPass').value, creditos }) });
    }
    cerrarModal();
    cargarAdmin();
  } catch (e) { alert(e.message); }
});

$('formCreditos').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('credUserId').value;
  const cantidad = parseInt($('inputSumar').value) || 0;
  try {
    await api('/api/admin/creditos/' + id, { method: 'POST', body: JSON.stringify({ cantidad }) });
    cerrarModalCreditos();
    cargarAdmin();
  } catch (e) { alert(e.message); }
}

function cerrarModalCreditos() { $('modalCreditos').classList.remove('show'); }

async function logout() {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/login.html';
}

cargarAdmin();
setInterval(cargarAdmin, 30000);
</script>
</body>
</html>
